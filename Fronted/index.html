<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Gastos</title>
</head>
<body>

<h1>Administración de Gastos</h1>

<form>
    <label>Monto:</label><br>
    <input type="number" placeholder="Ingrese el monto"><br><br>

    <label>Categoría:</label><br>
    <input type="text" placeholder="Ej: Comida"><br><br>

    <label>Fecha:</label><br>
    <input type="date"><br><br>

    <label>Tipo:</label><br>
    <select>
        <option>Ingreso</option>
        <option>Gasto</option>
    </select><br><br>

    <button type="submit">Guardar</button>
</form>

</body>
</html>
